services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kitdesk
      POSTGRES_USER: ${DB_USER:-kitdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kitdesk}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d kitdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/kitdesk
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}   # demo accounts for local runs
      DB_USER: ${DB_USER:-kitdesk}
      DB_PASSWORD: ${DB_PASSWORD:-kitdesk}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
    ports:
      - "8080:8080"

volumes:
  pgdata:
