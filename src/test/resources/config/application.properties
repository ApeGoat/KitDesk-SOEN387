# Test-only settings, loaded on top of src/main/resources/application.yml.
# The tests use the demo accounts (alice@, bob@, staff@, student01..50@kitdesk.test).
spring.profiles.active=demo
kitdesk.jwt.secret=test-secret-for-automated-tests-only-0123456789
# Scheduled jobs off in tests ("-" disables a cron); the tests call the jobs directly.
kitdesk.jobs.expiry-cron=-
kitdesk.jobs.reassign-cron=-
kitdesk.jobs.key-cleanup-cron=-
