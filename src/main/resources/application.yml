# All environment-specific settings come from environment variables (see .env.example).
# The defaults below only suit a local docker compose run; never put real secrets here.
spring:
  application:
    name: kitdesk
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kitdesk}
    username: ${DB_USER:kitdesk}
    password: ${DB_PASSWORD:kitdesk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
  flyway:
    enabled: true
    # Schema and catalogue only. The demo accounts (db/demo) load only with the "demo" profile.
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # request bodies are closed: unknown fields are a 400

kitdesk:
  # Signs login tokens (HS256). At least 32 characters. Required: the app won't start without it.
  jwt:
    secret: ${JWT_SECRET:}
    lifetime: PT30M
  # "Today" for booking rules is today at the desk.
  timezone: ${KITDESK_TIMEZONE:America/Toronto}
  jobs:
    expiry-cron: "0 5 0 * * *"       # 00:05 every day
    reassign-cron: "0 0 * * * *"     # every hour
    key-cleanup-cron: "0 30 * * * *" # every hour, at half past

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # HealthController serves these groups at the contract's paths, /health/live and /health/ready.
      # Readiness also checks the database, so it reports DOWN (503) if Postgres is unreachable.
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    # Every log line carries the request's correlation ID.
    level: "%5p [%X{correlationId:-}]"

springdoc:
  swagger-ui:
    # Show the hand-written contract (src/main/resources/static/openapi.yaml), not a generated one.
    path: /swagger-ui.html
    url: /openapi.yaml
